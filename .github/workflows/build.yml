name: Build IPA
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip3 install flet flet-cli --break-system-packages
      - run: flet build ipa --org com.res18dprch.player --yes
      - name: Create IPA
        run: |
          mkdir -p Payload
          # Ищем любой файл .app в папке build и копируем его в Payload
          find build -name "*.app" -exec cp -r {} Payload/ \;
          zip -vr manual_build.ipa Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: APP_FINISHED
          path: manual_build.ipa
