name: Build IPA
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip3 install flet flet-cli --break-system-packages
      # Меняем 'ios' на 'ipa', чтобы Flet не ругался
      - run: flet build ipa --org com.res18dprch.player --yes --release
      - name: Create IPA
        run: |
          mkdir -p Payload
          # Ищем скомпилированный .app и пакуем его
          find build/ipa -name "*.app" -exec cp -r {} Payload/ \;
          zip -vr manual_build.ipa Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: APP_FINISHED
          path: manual_build.ipa
