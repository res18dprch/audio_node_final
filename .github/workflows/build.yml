name: Build IPA
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip3 install flet flet-cli --break-system-packages
      # Убрали флаг --release, который вызывал ошибку
      - run: flet build ipa --org com.res18dprch.player --yes
      - name: Create IPA
        run: |
          mkdir -p Payload
          # Собираем приложение из папки билда
          cp -r build/ipa/*.app Payload/
          zip -vr manual_build.ipa Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: APP_FINISHED
          path: manual_build.ipa
