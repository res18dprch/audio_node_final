name: Build IPA
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip3 install flet flet-cli --break-system-packages
      - run: flet build ipa --org com.res18dprch.player --yes
      - name: Inject File Sharing Permissions
        run: |
          mkdir -p Payload
          find build -name "*.app" -exec cp -r {} Payload/ \;
          # ПРИНУДИТЕЛЬНОЕ ВКЛЮЧЕНИЕ ОБМЕНА ФАЙЛАМИ
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" Payload/*.app/Info.plist
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" Payload/*.app/Info.plist
          # УБИРАЕМ КЭШИРОВАНИЕ
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.res18dprch.player.v5" Payload/*.app/Info.plist
          zip -vr final_fixed.ipa Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: APP_STABLE
          path: final_fixed.ipa
